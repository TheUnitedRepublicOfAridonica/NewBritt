<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Britt City</title>
    <style>
      :root {
        --sky-top: #071b28;
        --sky-mid: #0f2436;
        --sky-low: #0a1c2a;
        --grid: rgba(173, 213, 232, 0.09);
        --asphalt: #354a57;
        --asphalt-deep: #283b46;
        --concrete: #dce3e6;
        --concrete-2: #c7cfd4;
        --navy: #1d2e3f;
        --charcoal: #3e4c58;
        --brick: #7f5149;
        --slate: #677482;
        --gold: #f3d77a;
        --gold-2: #d4b55f;
        --window-off: #202f3b;
        --window-on: #f7d873;
        --label: #0b1623;
        --glass: rgba(255,255,255,0.74);
        --shadow: rgba(0,0,0,0.28);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--sky-top);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .viewport {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 28%, rgba(136, 201, 224, 0.18), transparent 25%),
          linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 28%, var(--sky-low) 100%);
      }

      .viewport::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 30px 30px;
        opacity: 0.8;
      }

      .city-shell {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(1680px, 96vw);
        height: min(900px, 84vh);
        border: 1px solid rgba(160, 199, 224, 0.24);
        background: rgba(10, 24, 35, 0.18);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        overflow: hidden;
      }

      .city-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 62% 38%;
      }

      .block {
        position: relative;
        overflow: hidden;
        background: rgba(219, 225, 228, 0.08);
        border: 1px solid rgba(255,255,255,0.04);
      }

      .road {
        position: absolute;
        z-index: 4;
        background: linear-gradient(180deg, var(--asphalt) 0%, var(--asphalt-deep) 100%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .road-horizontal {
        left: 0;
        right: 0;
        top: 50%;
        height: 12%;
        transform: translateY(-50%);
      }

      .road-horizontal::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 30px,
          rgba(247, 216, 111, 0.95) 30px 39px,
          transparent 39px 66px
        );
      }

      .road-vertical {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 12%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, var(--asphalt) 0%, var(--asphalt-deep) 100%);
      }

      .road-vertical::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent 0 32px,
          rgba(247, 216, 111, 0.95) 32px 40px,
          transparent 40px 68px
        );
      }

      .building {
        position: absolute;
        overflow: hidden;
        box-shadow: 0 10px 18px rgba(0,0,0,0.14);
        transition: transform 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease;
      }

      .building:hover {
        transform: scale(1.05);
        filter: brightness(1.05);
        box-shadow: 0 16px 24px rgba(0,0,0,0.18);
      }

      .building::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 25%, rgba(0,0,0,0.08) 100%);
      }

      .roof-detail {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 12px;
        background: rgba(255,255,255,0.12);
      }

      .left-block .building:nth-child(1) {
        left: 5%;
        bottom: 12%;
        width: 18%;
        height: 30%;
        background: var(--navy);
      }

      .left-block .building:nth-child(2) {
        left: 27%;
        bottom: 12%;
        width: 20%;
        height: 42%;
        background: var(--charcoal);
      }

      .left-block .building:nth-child(3) {
        left: 51%;
        bottom: 12%;
        width: 24%;
        height: 36%;
        background: var(--brick);
      }

      .left-block .building:nth-child(4) {
        left: 78%;
        bottom: 10%;
        width: 14%;
        height: 28%;
        background: var(--slate);
      }

      .right-block .building:nth-child(1) {
        right: 8%;
        bottom: 12%;
        width: 18%;
        height: 38%;
        background: var(--navy);
      }

      .right-block .building:nth-child(2) {
        right: 31%;
        bottom: 12%;
        width: 19%;
        height: 28%;
        background: var(--slate);
      }

      .right-block .building:nth-child(3) {
        right: 55%;
        bottom: 12%;
        width: 21%;
        height: 40%;
        background: var(--brick);
      }

      .right-block .building:nth-child(4) {
        right: 78%;
        bottom: 12%;
        width: 13%;
        height: 28%;
        background: var(--charcoal);
      }

      .tower {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(34vw, 420px);
        height: min(62vh, 560px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        z-index: 6;
      }

      .tower-head {
        position: relative;
        width: 68%;
        min-width: 200px;
        height: 54px;
        margin-bottom: 2px;
        background: rgba(6, 12, 18, 0.92);
        border: 1px solid rgba(255,255,255,0.12);
        color: rgba(244,247,251,0.9);
        text-transform: uppercase;
        letter-spacing: 0.26em;
        font-size: clamp(12px, 1vw, 22px);
        font-weight: 700;
        display: grid;
        place-items: center;
        box-shadow: 0 0 32px rgba(173, 220, 245, 0.22);
      }

      .tower-head::before,
      .tower-head::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 28%;
        height: 2px;
        background: rgba(255,255,255,0.18);
        transform: translateY(-50%);
      }

      .tower-head::before { left: 8%; }
      .tower-head::after { right: 8%; }

      .tower-top {
        position: relative;
        width: 74%;
        height: 18px;
        background: rgba(255,255,255,0.12);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      }

      .tower-body {
        position: relative;
        width: 76%;
        height: 80%;
        background: linear-gradient(180deg, rgba(8, 16, 24, 0.94), rgba(3, 7, 10, 0.96));
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 12px 22px rgba(0,0,0,0.18);
        overflow: hidden;
      }

      .tower-body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.06), transparent 12%, transparent 88%, rgba(255,255,255,0.06)),
          linear-gradient(180deg, rgba(255,255,255,0.04), transparent 20%, rgba(0,0,0,0.18));
      }

      .floor {
        position: absolute;
        left: 0;
        right: 0;
        height: 33.333%;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        padding: 12px 18px;
      }

      .floor:nth-child(1) { top: 0; }
      .floor:nth-child(2) { top: 33.333%; }
      .floor:nth-child(3) { top: 66.666%; }

      .floor span {
        display: block;
        width: 100%;
        height: 52%;
        min-height: 22px;
        background: linear-gradient(180deg, var(--gold), var(--gold-2));
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
        animation: lightPulse 2.8s infinite ease-in-out;
        animation-delay: calc(var(--i) * 0.12s);
      }

      @keyframes lightPulse {
        0%, 100% {
          background: linear-gradient(180deg, rgba(245, 214, 113, 0.8), rgba(181, 150, 72, 0.9));
          box-shadow: 0 0 0 rgba(255, 216, 107, 0);
        }
        38%, 64% {
          background: linear-gradient(180deg, rgba(255, 224, 119, 1), rgba(214, 181, 81, 1));
          box-shadow: 0 0 16px rgba(255, 216, 107, 0.7);
        }
      }

      .tower-base {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 84%;
        height: 14%;
        background: rgba(8, 12, 18, 0.88);
        border-top: 1px solid rgba(255,255,255,0.06);
      }

      .tower-base::before {
        content: "";
        position: absolute;
        inset: 18px 14px 0;
        background: repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.06) 0 14px,
          transparent 14px 28px
        );
      }

      .ground-strip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 22%;
        display: grid;
        grid-template-columns: repeat(11, minmax(0, 1fr));
        gap: 0;
        z-index: 5;
        background: linear-gradient(180deg, rgba(14, 20, 26, 0.18), rgba(8, 10, 12, 0.9));
      }

      .pillar {
        position: relative;
        height: 100%;
        background: linear-gradient(180deg, rgba(18, 25, 30, 0.94), rgba(5, 7, 10, 0.98));
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 8px 18px rgba(0,0,0,0.14);
      }

      .pillar::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent 24%, transparent 75%, rgba(0,0,0,0.12));
      }

      .mid-row {
        position: absolute;
        left: 18%;
        right: 18%;
        bottom: 12%;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .mini {
        position: relative;
        flex: 1;
        height: 20%;
        min-height: 24px;
        background: linear-gradient(180deg, #d7c98c, #b49960);
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      }

      .mini::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent 22%, rgba(0,0,0,0.08) 100%);
      }

      @media (max-width: 900px) {
        .city-shell { width: 96vw; height: 76vh; }
        .road-vertical { width: 14%; }
        .tower { width: 48vw; }
        .tower-head { letter-spacing: 0.18em; }
      }
    </style>
  </head>
  <body>
    <main class="viewport" aria-label="Minimalist top-down city map">
      <div class="city-shell">
        <div class="city-grid">
          <section class="block left-block" aria-label="left city block">
            <div class="building"><span class="roof-detail"></span></div>
            <div class="building"><span class="roof-detail"></span></div>
            <div class="building"><span class="roof-detail"></span></div>
            <div class="building"><span class="roof-detail"></span></div>
          </section>

          <section class="block right-block" aria-label="right city block">
            <div class="building"><span class="roof-detail"></span></div>
            <div class="building"><span class="roof-detail"></span></div>
            <div class="building"><span class="roof-detail"></span></div>
            <div class="building"><span class="roof-detail"></span></div>
          </section>

          <section class="block" aria-label="lower left block"></section>
          <section class="block" aria-label="lower right block"></section>
        </div>

        <div class="road road-horizontal" aria-hidden="true"></div>
        <div class="road road-vertical" aria-hidden="true"></div>

        <div class="tower" aria-label="Central tower">
          <div class="tower-head">New Britt</div>
          <div class="tower-top"></div>
          <div class="tower-body">
            <div class="floor">
              <span style="--i:1"></span>
              <span style="--i:2"></span>
              <span style="--i:3"></span>
              <span style="--i:4"></span>
              <span style="--i:5"></span>
            </div>
            <div class="floor">
              <span style="--i:6"></span>
              <span style="--i:7"></span>
              <span style="--i:8"></span>
              <span style="--i:9"></span>
              <span style="--i:10"></span>
            </div>
            <div class="floor">
              <span style="--i:11"></span>
              <span style="--i:12"></span>
              <span style="--i:13"></span>
              <span style="--i:14"></span>
              <span style="--i:15"></span>
            </div>
          </div>
          <div class="tower-base"></div>
        </div>

        <div class="mid-row" aria-hidden="true">
          <div class="mini"></div>
          <div class="mini"></div>
          <div class="mini"></div>
          <div class="mini"></div>
        </div>

        <div class="ground-strip" aria-hidden="true">
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
          <div class="pillar"></div>
        </div>
      </div>
    </main>

    <script>
      const towers = document.querySelectorAll('.tower, .building, .mini, .pillar');
      towers.forEach((el, index) => {
        el.style.animationDelay = `${(index * 0.12).toFixed(2)}s`;
      });

      const scene = document.querySelector('.viewport');
      let t = 0;

      function animate() {
        t += 0.015;
        const bob = Math.sin(t) * 2;
        const glow = 0.85 + Math.sin(t * 1.8) * 0.18;
        const tower = document.querySelector('.tower');

        if (tower) {
          tower.style.transform = `translate(-50%, calc(-50% + ${bob}px))`;
        }

        scene.style.filter = `drop-shadow(0 0 ${16 + glow * 10}px rgba(146, 196, 222, 0.08))`;
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
