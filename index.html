<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Britt City</title>
  <link rel="stylesheet" href="styles.css" />
</head>

  <div class="scene">
    <div class="stars"></div>

    <div class="clouds">
      <div class="cloud"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
    </div>

    <div class="scan"></div>

    <div class="tower-wrap">
      <div class="tower">
        <div class="antenna"></div>
        <div class="spire"></div>
        <div class="roof"></div>

        <div class="sign">
          <span>NEW BRITT</span>
        </div>

        <div class="windows">
          <span style="--i:1"></span>
          <span style="--i:2"></span>
          <span style="--i:3"></span>
          <span style="--i:4"></span>

          <span style="--i:14"></span>
          <span style="--i:15"></span>
          <span style="--i:16"></span>
        </div>
      </div>
    </div>

    <div class="city">
      <div class="building b1">
        <div class="windows">
          <span style="--d:0.2s"></span>
          <span style="--d:0.8s"></span>

          <span style="--d:1.5s"></span>
          <span style="--d:0.1s"></span>

      </div>

      <div class="building b3">
        <div class="windows">
          <span style="--d:0.6s"></span>
          <span style="--d:1.1s"></span>

          <span style="--d:1.5s"></span>

          <span style="--d:1.1s"></span>
          <span style="--d:1.8s"></span>
          <span style="--d:0.6s"></span>
          <span style="--d:1.2s"></span>
          <span style="--d:0.5s"></span>
          <span style="--d:0.9s"></span>

      <div class="building b5">
