<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Britt City</title>
  <style>
    :root {
      --bg1: #07111d;
      --bg2: #0d1b2a;
      --sky-glow: #7ec8ff;
      --pixel-dark: #121b25;
      --pixel-mid: #1d2d3a;
      --pixel-light: #2c465d;
      --window-on: #ffe38c;
      --window-off: #1c2b38;
      --neon: #7ef7ff;
      --accent: #ff9d5c;
      --gold: #ffd76c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(126, 200, 255, 0.22), transparent 25%),
        linear-gradient(to bottom, var(--bg1) 0%, var(--bg2) 50%, #050d16 100%);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(92vw, 1100px);
      height: min(74vh, 760px);
      border: 6px solid rgba(126, 200, 255, 0.25);
      background:
        linear-gradient(to bottom, rgba(19, 31, 44, 0.25), rgba(3, 10, 16, 0.75)),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02) 0 2px,
          transparent 2px 8px
        );
      box-shadow:
        0 0 0 6px rgba(0, 0, 0, 0.18),
        0 24px 80px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(126, 200, 255, 0.18);
      image-rendering: pixelated;
      overflow: hidden;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    .stars, .clouds, .city {
      position: absolute;
      inset: 0;
    }

    .stars {
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(126,200,255,0.7) 0 1px, transparent 1.5px);
      background-size: 180px 180px;
      background-position: 0 0, 60px 90px;
      opacity: 0.7;
      animation: twinkle 6s linear infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 0.55; }
    }

    .clouds {
      background:
        linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.08) 100%);
    }

    .cloud {
      position: absolute;
      width: 200px;
      height: 40px;
      background: rgba(152, 199, 255, 0.15);
      box-shadow:
        32px 8px 0 rgba(152, 199, 255, 0.11),
        74px 18px 0 rgba(152, 199, 255, 0.1),
        124px 2px 0 rgba(152, 199, 255, 0.1);
      border-radius: 10px;
      filter: blur(1px);
      animation: drift 26s linear infinite;
    }

    .cloud:nth-child(1) { top: 12%; left: -12%; animation-delay: -5s; }
    .cloud:nth-child(2) { top: 18%; left: -18%; animation-delay: -16s; }
    .cloud:nth-child(3) { top: 28%; left: -14%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(130vw); }
    }

    .city {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56%;
      display: flex;
      align-items: end;
      justify-content: center;
      gap: 12px;
      padding: 0 25px 0;
    }

    .building {
      position: relative;
      width: 82px;
      background: linear-gradient(to right, var(--pixel-dark), var(--pixel-mid), var(--pixel-light));
      border-left: 4px solid rgba(255,255,255,0.05);
      border-right: 4px solid rgba(255,255,255,0.05);
      box-shadow: inset 0 0 0 4px rgba(0,0,0,0.18);
      image-rendering: pixelated;
      overflow: hidden;
    }

    .building::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.02) 0%, transparent 18%, transparent 82%, rgba(255,255,255,0.02) 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.03) 0 4px,
          transparent 4px 10px
        );
    }

    .building .windows {
      position: absolute;
      inset: 10px 8px 10px 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      z-index: 1;
    }

    .building .windows span {
      display: block;
      width: 100%;
      height: 18px;
      background: var(--window-off);
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.16);
      animation: pulse 3s infinite ease-in-out;
      animation-delay: var(--d);
      opacity: 0.7;
    }

    @keyframes pulse {
      0%, 100% {
        background: var(--window-off);
        box-shadow: 0 0 0 rgba(255,227,140,0);
      }
      20%, 60% {
        background: var(--window-on);
        box-shadow: 0 0 10px rgba(255,227,140,0.7);
      }
    }

    .b1 { height: 150px; }
    .b2 { height: 210px; width: 96px; }
    .b3 { height: 240px; }
    .b4 { height: 290px; width: 112px; }
    .b5 { height: 400px; width: 170px; }
    .b6 { height: 270px; }
    .b7 { height: 180px; }

    .tower-wrap {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 260px;
      height: 520px;
      display: flex;
      align-items: end;
      justify-content: center;
      z-index: 5;
    }

    .tower {
      position: relative;
      width: 220px;
      height: 100%;
      background:
        linear-gradient(to bottom,
          #2b4155 0%,
          #1b2c3e 14%,
          #101c2a 45%,
          #0d1823 100%);
      box-shadow:
        inset 0 0 0 6px rgba(255,255,255,0.04),
        inset 0 0 30px rgba(126,200,255,0.08),
        0 0 32px rgba(126,200,255,0.18);
      border-left: 6px solid rgba(255,255,255,0.08);
      border-right: 6px solid rgba(255,255,255,0.08);
      overflow: hidden;
      clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%);
    }

    .tower::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.06) 0%, transparent 10%, transparent 90%, rgba(255,255,255,0.06) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.04) 0 2px,
          transparent 2px 10px
        );
    }

    .tower .spire {
      position: absolute;
      left: 50%;
      top: -32px;
      transform: translateX(-50%);
      width: 54px;
      height: 54px;
      background: linear-gradient(to bottom, #f8d978, #b57c1a);
      clip-path: polygon(50% 0%, 100% 100%, 0 100%);
      box-shadow: 0 0 18px rgba(255,215,108,0.8);
    }

    .tower .antenna {
      position: absolute;
      left: 50%;
      top: -96px;
      transform: translateX(-50%);
      width: 5px;
      height: 70px;
      background: #dfe9fa;
      box-shadow: 0 0 8px rgba(255,255,255,0.7);
    }

    .tower .antenna::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -10px;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 10px rgba(126,247,255,0.8);
    }

    .tower .roof {
      position: absolute;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      width: 140px;
      height: 18px;
      background: linear-gradient(to right, #4d6579, #1c2c39, #4d6579);
      box-shadow: 0 0 12px rgba(126, 200, 255, 0.18);
    }

    .tower .sign {
      position: absolute;
      left: 50%;
      top: 110px;
      transform: translateX(-50%);
      width: 170px;
      height: 74px;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(15,20,30,0.9), rgba(6,10,16,0.9));
      border: 4px solid rgba(126,247,255,0.7);
      box-shadow:
        0 0 0 4px rgba(126,247,255,0.18),
        0 0 20px rgba(126,247,255,0.45);
      clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
    }

    .tower .sign span {
      font-size: clamp(17px, 1.2vw, 22px);
      letter-spacing: 0.26em;
      color: var(--neon);
      text-transform: uppercase;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(126,247,255,0.8);
      white-space: nowrap;
    }

    .tower .windows {
      position: absolute;
      inset: 190px 18px 28px 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      z-index: 1;
    }

    .tower .windows span {
      display: block;
      height: 52px;
      background: var(--window-off);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.18);
      animation: towerPulse 2.3s infinite ease-in-out;
      animation-delay: calc(var(--i) * 0.15s);
    }

    @keyframes towerPulse {
      0%, 100% {
        background: var(--window-off);
        box-shadow: 0 0 0 rgba(255, 227, 140, 0), inset 0 0 0 2px rgba(0,0,0,0.18);
      }
      25%, 65% {
        background: var(--window-on);
        box-shadow: 0 0 10px rgba(255, 227, 140, 0.85), inset 0 0 0 2px rgba(0,0,0,0.12);
      }
    }

    .street {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: linear-gradient(to bottom, #0d1218 0%, #090d13 100%);
      border-top: 6px solid rgba(255,255,255,0.08);
    }

    .street::before {
      content: "";
      position: absolute;
      inset: 8px 0 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,210,93,0.9) 0 10px,
          transparent 10px 36px
        );
      opacity: 0.6;
    }

    .street::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.5));
    }

    .scan {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 22%;
      background: linear-gradient(to bottom, rgba(126,200,255,0.15), transparent);
      animation: scan 8s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(340%); }
    }

    @media (max-width: 760px) {
      .city {
        gap: 6px;
        padding: 0 12px;
      }

      .building {
        width: 54px;
      }

      .b5 {
        width: 110px;
      }

      .tower-wrap {
        width: 180px;
        height: 470px;
      }

      .tower {
        width: 160px;
      }

      .tower .sign {
        width: 130px;
        height: 56px;
      }

      .tower .sign span {
        letter-spacing: 0.15em;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="stars"></div>

      <div class="cloud"></div>
      <div class="cloud"></div>

        <div class="sign">
          <span>NEW BRITT</span>

          <span style="--d:0.3s"></span>

          <span style="--d:0.7s"></span>
          <span style="--d:1.2s"></span>

          <span style="--d:1.8s"></span>
          <span style="--d:0.3s"></span>
          <span style="--d:1.5s"></span>
          <span style="--d:0.1s"></span>
        </div>
      </div>

      <div class="building b3">
        <div class="windows">
          <span style="--d:0.6s"></span>
          <span style="--d:1.1s"></span>

          <span style="--d:1.7s"></span>
          <span style="--d:0.4s"></span>
          <span style="--d:1.3s"></span>

          <span style="--d:1.2s"></span>
          <span style="--d:1.6s"></span>
        </div>
      </div>

      <div class="building b4">
        <div class="windows">
          <span style="--d:0.3s"></span>
          <span style="--d:1.5s"></span>
          <span style="--d:0.8s"></span>
          <span style="--d:1.1s"></span>
          <span style="--d:1.8s"></span>
          <span style="--d:0.6s"></span>
          <span style="--d:1.2s"></span>
          <span style="--d:0.5s"></span>
          <span style="--d:0.9s"></span>
        </div>
      </div>

      <div class="building b5">
        <div class="windows">
          <span style="--d:0.1s"></span>
          <span style="--d:0.8s"></span>
          <span style="--d:1.6s"></span>
          <span style="--d:0.4s"></span>
          <span style="--d:1.1s"></span>
          <span style="--d:1.7s"></span>
          <span style="--d:0.7s"></span>
          <span style="--d:1.4s"></span>
          <span style="--d:0.3s"></span>
        </div>
      </div>

      <div class="building b6">
        <div class="windows">
          <span style="--d:1.3s"></span>
          <span style="--d:0.6s"></span>
          <span style="--d:0.9s"></span>
          <span style="--d:1.8s"></span>
          <span style="--d:0.5s"></span>
